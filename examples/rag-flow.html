&lt;script&gt;
(function () {
  &quot;use strict&quot;;
  const root = document.getElementById(&quot;rag-flow-viewer&quot;);

  const actionNames = { REQUEST_INFO: &quot;추가 관측 요청&quot;, RETRIEVE_AGAIN: &quot;조건을 바꿔 재검색&quot;,
    PROVIDE_SOP: &quot;등록 절차 안내&quot;, ESCALATE: &quot;운영자 검토 요청&quot; };
  const issueNames = { MISSING: &quot;관측 없음&quot;, WRONG_UNIT: &quot;단위 불일치&quot;, STALE: &quot;관측 시효 초과&quot;,
    BAD_QUALITY: &quot;계기 품질 미충족&quot;, MODE_MISMATCH: &quot;운전 모드 불일치&quot;,
    NO_ACTIVE_ALARM: &quot;활성 알람 없음&quot;, UNSUPPORTED_ALARM: &quot;적용 대상 밖의 알람&quot;,
    ALARM_OBSERVATIONS_UNVERIFIED: &quot;알람 발생 근거 미확인&quot; };
  const docNames = { &quot;RC01-S1&quot;: &quot;알람 원시 이력&quot;, &quot;RC01-S2&quot;: &quot;적용 조건 대조&quot;,
    &quot;RC01-S3&quot;: &quot;원인과 부족한 단서&quot;, &quot;RC01-S4&quot;: &quot;판단과 보류 기록&quot;,
    &quot;RC01-S5&quot;: &quot;기준 제어와 후속 관측&quot;, &quot;TEP-SEPARATOR&quot;: &quot;분리기 기술 참고&quot; };
  const modes = [
    { id: &quot;bm25&quot;, name: &quot;BM25&quot;, label: &quot;용어 검색&quot;, unit: &quot;BM25 점수&quot; },
    { id: &quot;dense&quot;, name: &quot;BGE-M3&quot;, label: &quot;의미 검색&quot;, unit: &quot;벡터 유사도&quot; },
    { id: &quot;rrf&quot;, name: &quot;RRF&quot;, label: &quot;순위 결합&quot;, unit: &quot;RRF 점수&quot; },

  let state = { caseId: &quot;recover&quot;, step: 0, mode: &quot;bm25&quot;, docId: &quot;RC01-S3&quot;, returned: false };

  };
  const unit = function (value) { return value === &quot;degC&quot; ? &quot;°C&quot; : value; };
  const current = function () { return data.cases.find(function (c) { return c.id === state.caseId; }); };
  const actionName = function (value) { return actionNames[value] || value; };
  const issueName = function (value) { return issueNames[value] || value; };
  const tagName = function (tag) {
    const spec = data.card.required_observations.find(function (r) { return r.tag === tag; });
    return spec ? spec.meaning : tag;
  };
  function normalize(saved) {
    const p = saved &amp;&amp; saved.privateContent;
    if (!p || p.version !== data.version || !data.cases.some(function (c) { return c.id === p.caseId; })) return;
    state = { caseId: p.caseId, step: Math.max(0, Math.min(4, Number.isInteger(p.step) ? p.step : 0)),
      mode: modes.some(function (m) { return m.id === p.mode; }) ? p.mode : &quot;bm25&quot;,
      docId: typeof p.docId === &quot;string&quot; ? p.docId : &quot;RC01-S3&quot;, returned: p.returned === true };
    if (state.step === 4 &amp;&amp; current().steps[0].action === &quot;REQUEST_INFO&quot;) state.returned = true;
  }
  function save() {
    if (window.openai &amp;&amp; typeof window.openai.setWidgetState === &quot;function&quot;) {

            displayedData: &quot;recorded SGS run; no live model execution&quot; },

      } catch (_) {}

  }
  function heading(kicker, title) {

  }
  function button(label, command, main) {

  }

  }
  function gates(gate) {
    const issues = gate.reasons.map(function (r) { return issueName(r); });

    });

    return &#x27;&lt;ul class=&quot;rf-list rf-small&quot;&gt;&#x27; + issues.map(function (text) { return &#x27;&lt;li&gt;&#x27; + esc(text) + &#x27;&lt;/li&gt;&#x27;; }).join(&quot;&quot;) + &#x27;&lt;/ul&gt;&#x27;;
  }

        &#x27;&lt;div class=&quot;rf-reading-label&quot;&gt;&#x27; + esc(spec.meaning) + &#x27;&lt;/div&gt;&#x27; +

        &#x27;&lt;div class=&quot;rf-time&quot;&gt;&#x27; + (reading ? &#x27;채취 &#x27; + fmt(reading.sampled_at_sim_h_or_null, 3) + &#x27; h · &#x27; : &#x27;&#x27;) + esc(status) + &#x27;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;rf-time&quot;&gt;&#x27; + esc(spec.tag) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;

  }
  function sourceLink(row) {

    return &#x27;&lt;a href=&quot;&#x27; + esc(url) + &#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 조항&lt;/a&gt;&#x27;;
  }
  function stepZero(c) {
    const alarms = c.initial.active_alarms;

      &#x27;&lt;div class=&quot;rf-space&quot;&gt;&#x27; + readings(c.initial) + &#x27;&lt;/div&gt;&#x27; +

      &#x27;&lt;h3 class=&quot;rf-space&quot;&gt;&#x27; + esc(c.title) + &#x27;&lt;/h3&gt;&lt;p class=&quot;rf-space-small&quot;&gt;&#x27; + esc(c.description) + &#x27;&lt;/p&gt;&#x27; +
      &#x27;&lt;div class=&quot;rf-callout rf-space&quot;&gt;&lt;p class=&quot;rf-small&quot;&gt;공개된 알람과 관측에서 질의를 만들고, 관련 조항을 검색한 뒤 적용 조건을 대조합니다.&lt;/p&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;p class=&quot;rf-note rf-space&quot;&gt;운전 모드 &lt;span class=&quot;rf-mono&quot;&gt;&#x27; + esc(c.initial.mode) + &#x27;&lt;/span&gt;&lt;/p&gt;&#x27; +
      next(&quot;검색 기록 보기&quot;) +
      &#x27;&lt;p class=&quot;rf-note rf-space-small&quot;&gt;버튼은 보관된 실행 단계를 펼칩니다.&lt;/p&gt;&#x27;;
  }
  function rankedRows(c) {
    const trace = c.search.result.trace || {};
    if (state.mode === &quot;bm25&quot; || state.mode === &quot;dense&quot;) {
      return (trace[state.mode] || []).map(function (row, i) {
        return { id: row.id, score: row.score, rank: i + 1 };
      });
    }
    const candidates = (trace.candidates || []).slice();

      return candidates.map(function (row) {

  function stepOne(c) {

      &#x27;&lt;p class=&quot;rf-note rf-space-small&quot;&gt;BM25 + BGE-M3 → RRF → Qwen 재정렬&lt;/p&gt;&#x27; +

      &#x27;&lt;p class=&quot;rf-note rf-space-small&quot;&gt;보기 전환은 검색이나 판단을 다시 실행하지 않습니다.&lt;/p&gt;&#x27; +

      }).join(&quot;&quot;) + &#x27;&lt;/ol&gt;&#x27; +

    right.innerHTML = heading(&quot;공개 계기에서 만든 영어 질의&quot;, &quot;무엇을 검색했나&quot;) +

      (first.action === &quot;REQUEST_INFO&quot; ? first.requested_tags.map(tagName).map(esc).join(&quot; · &quot;) + &#x27;을 추가로 확인하도록 선택했습니다.&#x27; :
        first.action === &quot;PROVIDE_SOP&quot; ? &#x27;같은 등록 문서의 전체 절차를 제시하도록 선택했습니다.&#x27; :
